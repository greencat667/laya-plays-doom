# ViZDoom scenario config for the "basic" scenario (ships inside the vizdoom
# package as basic.wad — no commercial Doom files needed, and Freedoom is
# used automatically as the IWAD when doom2.wad is not present).
#
# NOTE: doom_env.py sets doom_scenario_path / doom_game_path / doom_map /
# available_buttons / available_game_variables / buffers in Python (using
# vizdoom.scenarios_path so the paths are correct regardless of cwd or
# install location) *after* loading this file, so it always wins over the
# values below. Keep this file for the settings ViZDoom's own cfg format is
# actually good at: rewards, timing and rendering.

doom_map = map01

# Rewards (unused by laya-doom's own metrics, which are recomputed from
# game variables, but harmless to leave configured for parity with other
# ViZDoom examples/tools that read total_reward).
living_reward = -1
death_penalty = 100

# Episode timing (in tics; 35 tics = 1 second)
episode_start_time = 14
episode_timeout = 2100

# Rendering — headless by default; pass --render to experiments/run.py to
# open a window.
window_visible = false
render_hud = false
render_crosshair = false
render_weapon = true
render_decals = false
render_particles = false

mode = PLAYER
doom_skill = 3
