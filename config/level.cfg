# A real Freedoom2 level (default MAP01; override with DoomEnvConfig.doom_map
# / --doom-map), as opposed to one of ViZDoom's small purpose-built scenario
# wads. doom_env.py points doom_game_path at the Freedoom2 IWAD bundled
# inside the vizdoom package itself for this scenario — see LEVEL_SCENARIO
# in doom_env.py — so no separate doom_scenario_path is set here.
#
# A real level has no explicit "you won" game variable (checked against
# ViZDoom's full GameVariable enum — there isn't one), so EpisodeResult
# infers `completed` from the episode ending (e.g. an exit line/trigger)
# well before this timeout without the player having died. Generous
# on purpose: at real Laya decision latency this is meant to be a ceiling
# the operator's own --max-steps budget hits first, not something that
# itself cuts an episode short mid-exploration.
episode_start_time = 14
episode_timeout = 20000

window_visible = false
render_hud = false
render_crosshair = false
render_weapon = true

mode = PLAYER
doom_skill = 3
