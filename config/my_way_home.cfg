# ViZDoom's "my_way_home" scenario (bundled — ships as my_way_home.wad):
# a small labyrinth with no monsters. The objective is purely navigation —
# find the green vest (a GreenArmor pickup; classified as "armor" by
# perception.py, same as everywhere else) in a room somewhere in the maze.
# This is Stage 2 from the project brief: find the exit without an explicit
# path planner, using only WALL/PATH/AREA lines and repeated local Laya
# decisions.
#
# As with basic.cfg: doom_env.py sets doom_scenario_path / doom_map /
# available_buttons / available_game_variables / buffers in Python after
# loading this file, so it always wins over the values below.

# episode_timeout matches ViZDoom's own tuned default for this map (2100
# tics = 60s of simulated time) — the maze is small enough that this is
# generous, not tight, at typical decision-tic settings.
episode_start_time = 10
episode_timeout = 2100

window_visible = false
render_hud = false
render_crosshair = false
render_weapon = true

mode = PLAYER
doom_skill = 3
