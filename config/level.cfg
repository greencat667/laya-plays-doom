# A real Freedoom2 level (default MAP01; override with DoomEnvConfig.doom_map
# / --doom-map), as opposed to one of ViZDoom's small purpose-built scenario
# wads. doom_env.py points doom_game_path at the Freedoom2 IWAD bundled
# inside the vizdoom package itself for this scenario — see LEVEL_SCENARIO
# in doom_env.py — so no separate doom_scenario_path is set here.
#
# There's no explicit "you won" *game variable* (checked against ViZDoom's
# full GameVariable enum — there isn't one), but there IS a real, documented
# reward for it: ViZDoom's own bundled scenarios/freedoom2.cfg (for loading
# original Doom/Freedoom levels the same way this project's "level" scenario
# does) sets `map_exit_reward = 1` — "Reward for completing the level
# (exiting through the exit)". Found by researching the real ViZDoom
# feature rather than inferring EpisodeResult.completed purely from
# episode-end timing. Cross-checked against env.total_reward() in
# controller.run_episode's `completed` computation, scoped to
# scenario == "level" specifically — this key means nothing on
# basic/my_way_home, and basic's own built-in ACS kill-bonus reward would
# otherwise read as a false "completed" there.
map_exit_reward = 1
episode_start_time = 14
episode_timeout = 20000

window_visible = false
render_hud = false
render_crosshair = false
render_weapon = true

mode = PLAYER
doom_skill = 3
